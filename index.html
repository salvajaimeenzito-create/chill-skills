/* VOICE  occasion: a game-studio skill shop, cinematic and alive
   IDEA   a VFX artist's viewport at night: every skill is a glowing effect card, the hero is a live particle sim
   PICTURE a real-time canvas: energy core, embers, sparks with gravity bouncing on a wet floor, click explosions
   COLOUR near-black ink-violet ground, fire orange leads, energy cyan supports, hot pink accent
   TYPE   Unbounded (bold game lettering) + Manrope
   LAYOUT title over the left of the sim, core on the right; Roblox aisle rail; filter grid; tutorials; install */
:root{color-scheme:dark;--bg:#09080d;--bg2:#110f18;--card:#15121e;--card2:#1c1828;--line:#2a2438;--ink:#f4f0fa;--soft:#a89fb8;
--fire:#ff7a1a;--fire2:#ff3d2e;--cyan:#38e1ff;--pink:#ff3d7f;--ok:#2bd47a}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:76px;scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;line-height:1.08;letter-spacing:-.02em;margin:0}
a{color:inherit}button,select{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px)}
nav{position:fixed;top:0;left:0;right:0;z-index:40;background:linear-gradient(#09080dee,#09080d99);backdrop-filter:blur(12px);border-bottom:1px solid #ffffff10}
nav .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 17px Unbounded,sans-serif;text-decoration:none}
.logo img{width:32px;height:32px;display:block;filter:drop-shadow(0 0 14px #ff6a2a88)}
.links{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.links a{text-decoration:none;font-weight:800;color:var(--soft)}.links a:hover{color:#fff}
.ctl{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;min-width:44px;display:grid;place-items:center;padding:0 10px;font-weight:800}
.ctl svg{width:20px;height:20px}
select.ctl{appearance:none;padding:0 12px;text-align:center}
.ctl#mus.playing{color:#ffb36a;box-shadow:0 0 18px #ff8a3c44}
.mine{border:0;background:linear-gradient(135deg,var(--fire),var(--fire2));border-radius:12px;padding:0 16px;font-weight:800;min-height:44px;box-shadow:0 0 24px #ff5a2a55}
/* hero */
.hero{position:relative;height:min(92svh,780px);min-height:560px;overflow:hidden;background:#07060b}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hero .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.hero .lead{max-width:620px;pointer-events:auto}
.hero h1{font-size:clamp(36px,5.6vw,68px);text-wrap:balance}
.hero h1 span{background:linear-gradient(90deg,#ffe1a8,var(--fire) 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:18px;color:#d9d0e6;margin:16px 0 22px;max-width:50ch;text-shadow:0 2px 12px #000}
.search{display:flex;align-items:center;gap:10px;background:#16121fcc;border:1px solid #ffffff24;border-radius:16px;padding:0 16px;max-width:560px}
.search svg{width:22px;height:22px;flex:none;color:var(--soft)}
.search input{border:0;background:none;outline:0;font:17px Manrope,sans-serif;color:#fff;padding:16px 0;width:100%}
.search input::placeholder{color:#b9aecb}
.search:focus-within{border-color:var(--fire);box-shadow:0 0 0 3px #ff7a1a44}
.counts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.count{border:1px solid #ffffff1f;background:#ffffff0d;border-radius:12px;padding:6px 12px;font-weight:800;white-space:nowrap;color:#e7def2}
.count b{font:700 20px Unbounded,sans-serif;margin-right:6px;color:#fff}
.hint{white-space:nowrap;position:absolute;right:max(5vw,16px);bottom:22px;z-index:2;font-size:13px;font-weight:800;color:#cfc4de;background:#00000066;border:1px solid #ffffff1a;border-radius:999px;padding:6px 12px;pointer-events:none}
@media(max-width:999px){.hero{height:auto;min-height:720px}.hero .wrap{justify-content:flex-start;padding-top:92px;padding-bottom:300px}.hint{left:50%;right:auto;transform:translateX(-50%)}}
@media(max-width:700px){.hero h1{font-size:34px}.hero p{font-size:16px}}
/* sections */
.band{padding:clamp(40px,6vw,80px) 0}
.dice{cursor:pointer;background:linear-gradient(135deg,#ff9a3c33,#ff3d7f33);border-color:#ff8a3c66;color:#fff;font:inherit;font-weight:800}
.dice:hover{border-color:#ffb36a;box-shadow:0 0 22px #ff7a1a55}
.vlt{background:radial-gradient(900px 400px at 85% 0,#6b3cff22,transparent),var(--bg)}
.vsteps{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.vsteps>span{display:flex;gap:10px;align-items:center;background:#ffffff0a;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;color:#e7def2}
.vsteps b{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#8b5cf6;color:#fff;font-size:14px;flex:none}
.vsteps a{color:#c4b5fd}
.vgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.vcard:hover{transform:translateY(-4px);border-color:var(--h)}
.vcard img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.vcard .vb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.vcard h3{font:700 20px Unbounded,sans-serif}
.vcard p{color:var(--soft);line-height:1.5}
.vcard .vt{display:flex;gap:6px;flex-wrap:wrap}
.vcard .vt span{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffffff10;color:#d9d0e6}
.vdl{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;text-decoration:none;font-weight:800;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 8px 24px #6d28d955}
.vdl:hover{filter:brightness(1.15)}
.vcom{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.vcom a{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:#ffffff08;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.vcom a:hover{border-color:#8b5cf6}
.vcom b{color:#fff}.vcom small{color:var(--soft);line-height:1.45}.vcom i{font-style:normal;color:#c4b5fd;font-size:13px;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-top:6px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--h)}
.pcard .ph{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--soft)}
.pcard .ph i{font-style:normal;font-size:22px}
.pcard q{quotes:none;font:600 17px/1.5 Manrope,sans-serif;color:#f1ebfa;flex:1}
.pcard .pf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard .pf small{color:var(--soft);font-weight:700;font-size:13px;margin-right:auto}
.pcopy{border:1px solid #ffffff24;background:#ffffff10;border-radius:12px;min-height:40px;padding:0 14px;font-weight:800}
.pcopy:hover{background:#fff;color:#111}
.pcopy.ok{background:#2bd47a;color:#04210f;border-color:#2bd47a}
.faq{display:grid;gap:10px;max-width:900px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 20px}
.faq summary{cursor:pointer;list-style:none;font:700 18px Manrope,sans-serif;padding:18px 30px 18px 0;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:26px;color:var(--fire);transition:transform .25s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{color:var(--soft);padding:0 0 18px;line-height:1.6}
.totop{position:fixed;right:18px;bottom:18px;z-index:45;width:50px;height:50px;border-radius:16px;border:1px solid #ffffff22;background:#16121fe6;backdrop-filter:blur(8px);display:grid;place-items:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s;box-shadow:0 10px 30px #000a}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:22px;height:22px}
.totop:hover{border-color:var(--fire);color:var(--fire)}
body.noclaude #comunidad,body.noclaude #navComm{display:none!important}
.shead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.shead h2{font-size:clamp(28px,4.2vw,46px)}
.shead p{margin:10px 0 0;color:var(--soft);max-width:60ch}
.roblox{background:radial-gradient(ellipse at 15% 0%,#3a1530 0,transparent 55%),radial-gradient(ellipse at 95% 30%,#0f2d3d 0,transparent 50%),var(--bg2);border-block:1px solid #ffffff0d}
.roblox h2 em{font-style:normal;color:var(--fire)}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:6px 0 6px}
.gallery figure{margin:0;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:4/3;border:1px solid #ffffff18;background:#1a2a1a}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.gallery figure:hover img{transform:scale(1.07)}
.gallery figcaption{position:absolute;left:10px;bottom:10px;font-size:13px;font-weight:800;background:#000a;border-radius:999px;padding:3px 10px}
@media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:flex;background:#ffffff0f;border:1px solid #ffffff14;border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;color:#d8cde6;border-radius:10px;padding:0 14px;min-height:42px;font-weight:800}
.seg button[aria-pressed=true]{background:#fff;color:#111}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 2px 14px;scrollbar-width:thin;scrollbar-color:#ffffff33 transparent}
.rail>*{scroll-snap-align:start;flex:0 0 min(320px,82vw)}
.railnav{display:flex;gap:10px;justify-content:flex-end}
.railnav button{border:1px solid #ffffff1f;width:46px;height:46px;border-radius:14px;background:#ffffff0d;font-size:22px;font-weight:800}
.railnav button:hover{background:var(--fire);border-color:var(--fire)}
/* cards */
.set{position:relative;background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .18s,box-shadow .25s,border-color .25s;will-change:transform}
.set:hover{border-color:color-mix(in srgb,var(--h) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--h) 40%,transparent),0 18px 50px -12px color-mix(in srgb,var(--h) 55%,transparent)}
.thumb{aspect-ratio:16/10;position:relative;overflow:hidden;background:#000}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.set:hover .thumb img,.set:hover .thumb svg{transform:scale(1.06)}
.shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff40,transparent 42%);opacity:0;transition:opacity .2s;pointer-events:none;mix-blend-mode:screen}
.set:hover .shine{opacity:1}
.tag{position:absolute;left:12px;top:12px;background:#000b;border:1px solid #ffffff26;color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;backdrop-filter:blur(6px)}
.badge{position:absolute;right:12px;top:12px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;color:#fff}
.b-mine{background:linear-gradient(135deg,var(--fire),var(--fire2))}.b-off{background:#3b3bb3}.b-com{background:#137a5c}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:19px}
.by{font-size:13px;font-weight:800;color:var(--soft)}
.body p{margin:0;color:#cfc6dc;font-size:15px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta b{font-size:13px;background:#ffffff0f;border:1px solid #ffffff12;border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap;color:#d8cfe5}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.add{flex:1;border:0;border-radius:14px;background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-weight:800;font-size:16px;min-height:48px;position:relative;overflow:hidden;box-shadow:0 8px 24px -8px #ff4a2a}
.add::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.add:hover::after{transform:translateX(120%)}
.add:active{transform:scale(.97)}
.add.done{background:linear-gradient(135deg,#2bd47a,#139a56);box-shadow:0 8px 24px -8px #2bd47a}
.more{border:1px solid var(--line);background:none;border-radius:14px;padding:0 14px;font-weight:800;min-height:48px}
.more:hover{border-color:#ffffff55}
/* grid */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chip[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.chip span{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:18px;padding-top:12px}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--soft);font-weight:800}
.lnote{font-size:13px;color:var(--soft);margin:8px 0 0}
/* tutorials */
.tuts{background:var(--bg2);border-top:1px solid #ffffff0d}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:18px}
.vid{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .2s,border-color .2s}
.vid:hover{transform:translateY(-4px);border-color:var(--h)}
.vthumb{aspect-ratio:16/9;position:relative;background:radial-gradient(circle at 70% 40%,color-mix(in srgb,var(--h) 70%,#000) 0,#0b0910 70%);overflow:hidden}
.vthumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.vid:hover .vthumb>img{transform:scale(1.05)}
.vthumb:has(img)::before{display:none}
.vthumb:has(img) .yt{display:none}
.vthumb:has(img) .play{left:auto;top:auto;right:12px;bottom:12px;margin:0;width:46px;height:46px;box-shadow:0 0 0 6px #ffffff2a,0 6px 20px #000a}
.vthumb:has(img) .play svg{width:18px;height:18px}
.vthumb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 28px),repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 28px)}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 10px #ffffff22,0 0 40px var(--h);transition:transform .25s}
.vid:hover .play{transform:scale(1.12)}
.play svg{width:24px;height:24px;margin-left:4px}
.vthumb .lang{position:absolute;right:10px;top:10px;font-size:12px;font-weight:800;background:#000a;border-radius:999px;padding:2px 9px}
.vthumb .yt{position:absolute;left:12px;bottom:10px;font:700 13px Unbounded,sans-serif;color:#fff;opacity:.85}
.vbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.vbody h3{font:700 16px/1.3 Manrope,sans-serif}
.vbody span{margin-top:auto;font-weight:800;color:var(--fire);font-size:14px}
.vgroup{font:700 18px Unbounded,sans-serif;margin:26px 0 14px;color:#e7def2}
/* how */
.promo{border-radius:24px;overflow:hidden;border:1px solid #ffffff1f;box-shadow:0 40px 100px -30px #000,0 0 90px -30px #ff7a1a77;margin:0 0 26px;background:#000}
.promo video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;overflow:hidden}
.step::before{content:"";position:absolute;width:160px;height:160px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(var(--h),transparent 65%);opacity:.35}
.step b{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--h);color:#111;font:800 20px Unbounded,sans-serif;margin-bottom:12px;box-shadow:0 0 24px var(--h)}
.step h3{font-size:18px;margin-bottom:6px}
.step p{margin:0;color:#cfc6dc}
.warnbox{margin-top:16px;color:var(--soft);font-size:14px}
footer{padding:30px 0 44px;color:var(--soft);font-size:14px;border-top:1px solid #ffffff0d}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
/* dialog */
dialog{border:1px solid var(--line);border-radius:26px;padding:0;width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--card);color:var(--ink);overflow:hidden}
dialog[open]{animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
dialog::backdrop{background:#05030acc;backdrop-filter:blur(4px)}
.dwrap{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dcover{height:170px;position:relative;flex:none;background:#000}
.dcover img,.dcover svg{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.x{position:absolute;right:12px;top:12px;border:1px solid #ffffff33;background:#000a;color:#fff;border-radius:12px;width:44px;height:44px;font-size:18px;font-weight:800;z-index:2}
.db{padding:18px 22px 22px;overflow:auto}
.db h3{font-size:26px;margin:4px 0 8px}
.db p{color:#d8cfe5;margin:0 0 12px}
.try{background:#ffffff0c;border:1px solid #ffffff14;border-left:3px solid var(--fire);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:none;border-radius:12px;padding:0 14px;font-weight:800;min-height:44px}
.tab[aria-selected=true]{background:#fff;color:#111;border-color:#fff}
ol.inst{margin:0;padding-left:22px}ol.inst li{margin:8px 0}
.code{display:flex;gap:8px;align-items:center;background:#07060b;border:1px solid #ffffff14;color:#ffd9c2;border-radius:12px;padding:8px 8px 8px 14px;margin:6px 0}
.code code{flex:1;font:14px/1.45 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.copy{border:0;background:#ffffff1a;border-radius:10px;padding:0 12px;min-height:40px;font-weight:800;flex:none}
.gh{display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-weight:800;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
.gh:hover{border-color:#fff}
.have{margin-top:16px;width:100%;border:0;background:linear-gradient(135deg,#2bd47a,#139a56);color:#fff;border-radius:14px;min-height:50px;font-weight:800;font-size:16px}
